spring:
  application:
    name: gateway
  config:
    import:
      - optional:classpath:application-common.yaml
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-route
              uri: lb://order
              predicates:
                - Path=/api/order/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: coupon-route
              uri: lb://coupon
              predicates:
                - Path=/api/coupon/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: product-route
              uri: lb://product
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: member-route
              uri: lb://member
              predicates:
                - Path=/api/member/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: ware-route
              uri: lb://ware
              predicates:
                - Path=/api/ware/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: third-party-route
              uri: lb://third-party
              predicates:
                - Path=/api/thirdParty/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # search 原来只有 Host 路由（search.gulimall.com），前台换成 Vue 之后要经 /api 调用。
            # 必须放在 admin-route（Path=/api/**）之前，否则会被它的通配路由抢走。
            - id: search-api-route
              uri: lb://search
              predicates:
                - Path=/api/search/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # auth 原来只有 Host 路由（auth.gulimall.com），前台换成 Vue、登录态改成 JWT 之后
            # 前端要走 /api/auth/**。同样必须放在 admin-route（Path=/api/**）之前，
            # 否则会被它抢走，最后落到 renren-fast 变成 404。
            - id: auth-api-route
              uri: lb://auth
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # cart 和 seckill 之前也只有 Host 路由（cart.gulimall.com / seckill.gulimall.com）。
            # Host 路由的前提是请求头里的 Host 就是那个域名，那是整页跳转才有的；
            # SPA 是 fetch('http://localhost:53000/api/...')，Host 是 localhost:53000，
            # 永远匹配不到 Host 路由，于是落到 admin-route 被 renren-fast 的 JWTFilter 拦成
            # {"msg":"invalid token","code":401}（而且它是 HTTP 200，很难查）。
            # 注意：这两条只是把请求送到正确的服务。cart 和 seckill 现在都是
            # @RestController，路径分别是 /cart/** 和 /seckill/front/**，前端直接调
            # /api/cart/list、/api/seckill/front/current 这类路径即可。
            # （seckill 原来把接口映射在根路径 /getCurrentSeckillSkus 上，剥掉 /api 之后
            #  变成 /seckill/getCurrentSeckillSkus，和谁都对不上，这条路由一直是空转的 404。）
            - id: cart-api-route
              uri: lb://cart
              predicates:
                - Path=/api/cart/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: seckill-api-route
              uri: lb://seckill
              predicates:
                - Path=/api/seckill/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: admin-route
              uri: lb://renren-fast
              predicates:
                - Path=/api/**
              filters:
                - RewritePath=/api/(?<segment>.*),/renren-fast/$\{segment}
            # 只留社交登录回跳：微博 / QQ 控制台登记的是 auth.gulimall.com/oauth2/**，改不了。
            # 其余 Host 路由对应的老页面早已删除，前台 SPA 一律走 /api/**
            - id: auth_route
              uri: lb://auth
              predicates:
                - Host=auth.gulimall.com

gl:
  auth:
    # 不需要凭证的接口，写客户端看到的完整路径。管理端登录入口和验证码的路径由 renren 决定，改不了名
    anonymous-paths:
      - /api/sys/login
      - /api/captcha.jpg

server:
  port: 53000


logging:
  level:
    reactor.netty: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.cloud.gateway: DEBUG
