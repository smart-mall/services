spring:
  application:
    name: gateway
  config:
    import:
      - optional:classpath:application-common.yaml
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-route
              uri: lb://order
              predicates:
                - Path=/api/order/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: coupon-route
              uri: lb://coupon
              predicates:
                - Path=/api/coupon/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: product-route
              uri: lb://product
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: member-route
              uri: lb://member
              predicates:
                - Path=/api/member/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: ware-route
              uri: lb://ware
              predicates:
                - Path=/api/ware/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: third-party-route
              uri: lb://third-party
              predicates:
                - Path=/api/thirdParty/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # search 原来只有 Host 路由（search.gulimall.com），前台换成 Vue 之后要经 /api 调用。
            # 必须放在 admin-route（Path=/api/**）之前，否则会被它的通配路由抢走。
            - id: search-api-route
              uri: lb://search
              predicates:
                - Path=/api/search/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # auth 原来只有 Host 路由（auth.gulimall.com），前台换成 Vue、登录态改成 JWT 之后
            # 前端要走 /api/auth/**。同样必须放在 admin-route（Path=/api/**）之前，
            # 否则会被它抢走，最后落到 renren-fast 变成 404。
            - id: auth-api-route
              uri: lb://auth
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # cart 和 seckill 之前也只有 Host 路由（cart.gulimall.com / seckill.gulimall.com）。
            # Host 路由的前提是请求头里的 Host 就是那个域名，那是整页跳转才有的；
            # SPA 是 fetch('http://localhost:53000/api/...')，Host 是 localhost:53000，
            # 永远匹配不到 Host 路由，于是落到 admin-route 被 renren-fast 的 JWTFilter 拦成
            # {"msg":"invalid token","code":401}（而且它是 HTTP 200，很难查）。
            # 注意：这两条只是把请求送到正确的服务。cart 的 CartController 仍然是 @Controller、
            # 返回视图名和 redirect，SPA 想拿到 JSON 还得另外改造它，加路由不等于能用。
            - id: cart-api-route
              uri: lb://cart
              predicates:
                - Path=/api/cart/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: seckill-api-route
              uri: lb://seckill
              predicates:
                - Path=/api/seckill/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: admin-route
              uri: lb://renren-fast
              predicates:
                - Path=/api/**
              filters:
                - RewritePath=/api/(?<segment>.*),/renren-fast/$\{segment}
            - id: host-route
              uri: lb://product
              predicates:
                - Host=gulimall.com
            - id: search-route
              uri: lb://search
              predicates:
                - Host=search.gulimall.com
            - id: item-route
              uri: lb://product
              predicates:
                - Host=item.gulimall.com
            - id: auth_route
              uri: lb://auth
              predicates:
                - Host=auth.gulimall.com
            - id: cart_route
              uri: lb://cart
              predicates:
                - Host=cart.gulimall.com
            - id: order_route
              uri: lb://order
              predicates:
                - Host=order.gulimall.com
            - id: member_route
              uri: lb://member
              predicates:
                - Host=member.gulimall.com
            - id: seckill_route
              uri: lb://seckill
              predicates:
                - Host=seckill.gulimall.com

server:
  port: 53000


logging:
  level:
    reactor.netty: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG
    org.springframework.cloud.gateway: DEBUG
