# gl-mock-pay —— 模拟第三方支付平台的站点配置。
#
# 只做两件事：
#   1. 把收银台页当静态文件发出去（参数在 query 里，由页面 JS 读取，服务端不渲染任何东西）
#   2. 把收银台提交的 /notify 转发给订单服务的回调地址
#
# 第 2 件是"平台的服务端"在扮演的角色：浏览器从头到尾不直连订单服务，
# 商户侧看到的请求来源永远是本容器。

# 用 Docker 的内嵌 DNS 按请求解析上游。nginx 默认只在启动时解析一次并永久缓存 IP，
# 而容器重建会换 IP —— 缓存住的话网关一重建，这里的转发就永久 502。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 同时听 IPv6。基础镜像的 entrypoint 会给默认配置补上这一行，但只在 default.conf 未被
    # 改动时才补 —— 我们覆盖了它，于是它跳过了，容器内用 localhost 访问会先解析到 ::1
    # 然后连接被拒。补回来，免得下次调试又踩一次。
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 收银台页。订单号、金额、票据都在 query 里，静态发出去就够了
    location / {
        try_files $uri $uri/ =404;
    }

    # 支付结果回调的转发入口。
    # 上游用容器名：本容器与网关在同一个 docker 网络上，所以商户的回调地址不需要公网可达
    # （真实项目里这一条是硬约束，这里是架构本身把它消掉了）。
    location = /notify {
        set $order_upstream gl-gateway:53000;
        proxy_pass http://$order_upstream/api/order/front/notify/mock;

        # 覆盖请求里可能自带的同名头，保证这个值只可能由本容器写入。
        # ⚠️ 它只是一个随请求携带的固定串，不是对参数做的签名；商户侧真正的一次性判据
        #    仍然是票据，这个头只把"请求确实经由平台"这件事表达出来。
        proxy_set_header X-Mock-Pay-Sign "gulimall-mock-pay-platform-sign";

        proxy_set_header Host $host;

        # 抹掉浏览器留下的同源标记。商户侧要把这条请求当成"服务器到服务器回调"来处理，
        # 而真实的平台服务器发出的请求不会带 Origin / Referer：留着 Origin 会被网关按跨源
        # 请求处理，53001 不在它的白名单里（也不该在），整条回调会被 CORS 拒掉。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # 关掉 Location 头重写：订单服务回的是指向前端结果页的地址，不能被改写成上游地址
        proxy_redirect off;

        # 商户侧拒绝时也回 302，浏览器要能跟着跳，所以上游的非 2xx 不当成错误吞掉
        proxy_intercept_errors off;
    }

    # 退款接口：扮演"第三方平台的退款 API"，由订单服务在后台审核通过时调用。
    #
    # 方向与支付相反 —— 支付是"用户提交 → 平台 → 回调商户"，退款是"商户 → 平台"：没有浏览器参与，
    # 也没有回调，平台在同一次请求-应答里给结论。两家真实渠道的差别只在这里体现：
    #   · 支付宝：同步问结果，code = 10000 且 fund_change = Y 才算退成功；
    #   · 微信：同步只回"已受理"（PROCESSING），真正结果靠**异步加密通知**，通知没回 SUCCESS 还会重投。
    #     后一种形状本项目没有模拟：它要状态与延时，而本容器是无状态的 nginx，两样都做不到；
    #     为一个替身再起一个有状态的服务不划算（mock 支付本身也只做到"收单 + 转发 + 凭证头"）。
    #
    # 应答字段取两家的并集：code / fund_change 来自支付宝，refund_id 来自微信（支付宝的退款没有
    # 独立单号），项目把它记进退款流水。$request_id 是 nginx 为每个请求生成的随机串，
    # 正好当"平台侧的退款单号"。
    location = /refund {
        default_type application/json;

        # 平台校验商户身份。真实渠道靠证书与签名 —— 要商业资质才申请得到；这里用一个固定头
        # 表达同一件事。值必须与 order 侧 gl.pay.mock.merchant-sign 一致，改名要两边一起改。
        if ($http_x_mock_merchant_sign != "gulimall-mock-pay-merchant-sign") {
            return 403 '{"code":"40002","msg":"商户凭证无效"}';
        }

        # 本替身记不住"这个退款单号处理过没有"，所以永远回"资金已变动"：平台侧的幂等模拟不了。
        # 真正的防线在商户侧 —— 申请单的状态流转是带状态条件的 UPDATE，同一笔申请走不到第二次退款。
        return 200 '{"code":"10000","msg":"Success","fund_change":"Y","refund_id":"$request_id"}';
    }
}
