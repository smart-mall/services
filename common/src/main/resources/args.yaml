# 参数配置

# mysql
mysql:
  url: gl-mysql
  port: 3306
  username: root
  password: root

# nacos
nacos:
  url: gl-nacos
  port: 8848

redis:
  url: gl-redis
  port: 6379
  password: 123456

minio:
  # clientPoint 是拼给前端的 URL 前缀，必须是浏览器能访问到的地址。
  # serverPoint 是后端 SDK 连 MinIO 用的地址，容器名形态，浏览器解析不了。
  # 预签名 URL 的 host 取自 SDK 的 endpoint，所以这两个值接错线时表现为
  # "后端签出来的地址前端连不上"，而不是一个报错。
  clientPoint: http://localhost:59000
  serverPoint: http://gl-minio:9000
  bucket: gulimall
  # 单文件大小上限，和 third-party 的 spring.servlet.multipart.max-file-size 保持一致
  max-size: 10MB
  access-key: minioadmin  # 访问密钥（默认 minioadmin）
  secret-key: minioadmin  # 密钥


rabbitmq:
  host: gl-rabbitmq
  port: 5672
  virtual-host: /

sentinel:
  dashboard: gl-sentinel:8858
  port: 8719

es:
  url: gl-es
  port: 9200

zipkin:
  url: gl-zipkin
  port: 9411
