name: "GrainMall"

services:
  gl-redis:
    image: redis
    container_name: gl-redis
    ports:
      - "56379:6379"
    volumes:
      - /volume/GrainMall/redis/data:/data
      - /volume/GrainMall/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    # 探活：redis 配了密码，必须带 -a；--no-auth-warning 免得告警混进健康检查输出
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - GrainMall-network

  gl-mysql:
    image: mysql:8.0
    container_name: gl-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: root
      # 库的墙钟必须与各服务 JVM（TZ=Asia/Shanghai）一致：oms_order 里 payment_time、
      # delivery_time 等由 SQL 的 NOW() 写入，create_time 由 Java 的 new Date() 写入，
      # 两边不同钟会让同一张表里"支付时间"比"下单时间"早 8 小时。
      TZ: Asia/Shanghai
    # 显式钉住会话时区，不依赖镜像内是否装了 tzdata；用 +08:00 偏移而非 Asia/Shanghai
    # 字面量，是因为后者要求 mysql 时区表已导入。
    command: ["--default-time-zone=+08:00"]
    # 探活：只确认 mysqld 能应答，不做业务查询。首次启动要初始化数据目录，给 30s 宽限。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "53306:3306"
    volumes:
      - /volume/GrainMall/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - /volume/GrainMall/mysql/data:/var/lib/mysql
    networks:
      - GrainMall-network

  gl-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: gl-minio
    ports:
      - "59000:9000"   # S3 API端口
      - "59001:9001"   # Web控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /volume/GrainMall/minio/data:/data
      - /volume/GrainMall/minio/config:/root/.minio
    command: server /data --console-address ":9001"
    # 探活：MinIO 自带的存活接口，镜像里已有 curl
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - GrainMall-network

  gl-front-end:
    image: grain-mall-admin:latest
    container_name: gl-front-end
    ports:
      - "56731:80"     # 后台管理前端（容器内 nginx 默认监听 80）
    networks:
      - GrainMall-network
    depends_on:
      - gl-gateway

  # 商城用户端 SPA。
  # 镜像**不由本仓库的 build-images.ps1 构建** —— 前端在独立仓库
  # D:\Projects\project\gulimall\user-vue，要 cd 过去执行：
  #   docker build -t grain-mall-user:latest .
  # 与 gl-front-end 一样只是静态托管、不反代后端：浏览器直接打
  # http://localhost:53000/api（见前端 src/tools/request.ts 的 baseURL）。
  # 因此 56732 这个源必须在网关 CorsConfiguration 的放行列表里 —— 已经在里面了。
  gl-user-front:
    image: grain-mall-user:latest
    container_name: gl-user-front
    ports:
      - "56732:80"     # 商城用户端（容器内 nginx 默认监听 80）
    networks:
      - GrainMall-network
    depends_on:
      - gl-gateway

  # 模拟第三方支付平台：收银台静态页 + 把 /notify 转发给订单服务的回调地址。
  # 镜像由本仓库的 build-images.ps1 构建（目录 mock-pay，不是 Maven 模块，镜像里没有 JVM）。
  #
  # 它刻意**映射端口**：真实支付平台在公网可达，浏览器必须能直接打开它的收银台页。
  # 这与"业务服务一律不映射端口"不冲突 —— 它不是我们的业务服务，是模拟出来的外部平台。
  gl-mock-pay:
    image: gl-mock-pay:latest
    container_name: gl-mock-pay
    ports:
      - "53001:80"
    networks:
      - GrainMall-network
    depends_on:
      - gl-gateway

  gl-nacos:
    image: nacos/nacos-server:latest
    container_name: gl-nacos
    environment:
      - MODE=standalone                    # 单机模式
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - SPRING_DATASOURCE_PLATFORM=mysql   # 使用MySQL持久化
      - MYSQL_SERVICE_HOST=gl-mysql           # MySQL主机
      - MYSQL_SERVICE_PORT=3306            # MySQL端口
      - MYSQL_SERVICE_DB_NAME=nacos        # 数据库名
      - MYSQL_SERVICE_USER=root           # 用户名
      - MYSQL_SERVICE_PASSWORD=root # 密码
      - MYSQL_DATABASE_NUM=1               # 数据库数量
      - JVM_XMS=512m                       # JVM初始内存
      - JVM_XMX=512m                       # JVM最大内存
    # 探活：Nacos 3.x 已经没有 /nacos/v1/console/health/readiness（8848 上 404，8080 上返回
    # "No static resource"），所以用实测可用的 8848 naming metrics，**再加 gRPC 端口 9848 的
    # TCP 探测** —— 9848 才是客户端注册走的口子，它没监听时注册会以
    # "NacosException: Client not connected, current status:STARTING" 直接终止启动。
    # Nacos 起得慢（连库 + 加载配置），给 60s 宽限、最多等 5 分钟。
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fs http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q UP && exec 3<>/dev/tcp/127.0.0.1/9848"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - /volume/GrainMall/nacos/log:/home/nacos/logs           # 日志挂载
    ports:
      - "58080:8080"
      - "58848:8848"
      - "59848:9848"
    networks:
      - GrainMall-network
    # Nacos 自己走外部 MySQL 持久化，所以它也必须在库能应答之后才起：
    # 历史日志里出现过连不上库导致 ExternalDataSourceServiceImpl 初始化失败、上下文刷新被取消。
    depends_on:
      gl-mysql:
        condition: service_healthy

  gl-es:
    image: elasticsearch:8.11.0
    container_name: gl-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "59200:9200"
      - "59300:9300"
    volumes:
      - /volume/GrainMall/es/config:/usr/share/elasticsearch/config
      - /volume/GrainMall/es/data:/usr/share/elasticsearch/data
      - /volume/GrainMall/es/plugins:/usr/share/elasticsearch/plugins
    networks:
      - GrainMall-network

  gl-rabbitmq:
    image: rabbitmq:management
    container_name: gl-rabbitmq
    ports:
      - "55671:5671"      # AMQP (TLS)
      - "55672:5672"      # AMQP 主端口（应用连接）
      - "54369:4369"      # Erlang 发现端口
      - "25672:25672"    # Erlang 集群通信端口
      - "15671:15671"    # Web 管理界面 (HTTPS)
      - "15672:15672"    # Web 管理界面（浏览器访问）
      - "51883:1883"      # MQTT 协议端口
      - "58883:8883"      # MQTT (TLS)
      - "61613:61613"    # STOMP 协议端口
      - "61614:61614"    # STOMP (TLS)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - GrainMall-network

  gl-sentinel:
    image: bladex/sentinel-dashboard:latest
    container_name: gl-sentinel
    ports:
      - "58858:8858"
      - "58719:8719"
    networks:
      - GrainMall-network

  gl-zipkin:
    image: openzipkin/zipkin:latest
    container_name: gl-zipkin
    ports:
      - "59411:9411"      # Zipkin UI 和 API 端口
    environment:
      - STORAGE_TYPE=mem  # 使用内存存储（开发环境）
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - GrainMall-network

  # ==================== 业务服务（本地构建的 gl-* 镜像）====================
  # 一律不映射端口：业务服务只允许经网关访问。映射到宿主机就等于开了一条绕过网关的路 ——
  # 网关会把客户端手写的 X-Member-Claims / X-Admin 抹掉，直连不经过网关，伪造的头就被当成真的。
  # 容器之间经 GrainMall-network 按服务名互访，服务端口在各自 application.yaml 的 server.port 里
  # 前置条件：镜像必须已存在于本机（本机构建的 gl-* 镜像，或 docker load / 从仓库 pull）
  #
  # 依赖一律写 condition: service_healthy，而不是默认的 service_started —— 后者只保证"容器
  # 起来了"，不保证服务能干活：Nacos 从容器启动到能受理 gRPC 注册（9848）要几十秒，抢跑的服务
  # 会在注册时抛 "Client not connected, current status:STARTING" 直接退出（gl-search 就这样死过
  # 一次、躺了 1.5 小时没人发现）。sentinel / zipkin 没有健康检查端点，只能退回 service_started。
  # 另加 restart: unless-stopped —— 万一仍有竞态漏网，容器自己重试，而不是死透。

  gl-gateway:
    image: gl-gateway:latest
    container_name: gl-gateway
    restart: unless-stopped
    ports:
      - "53000:53000"
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-product:
        condition: service_started
      gl-coupon:
        condition: service_started
      gl-member:
        condition: service_started
      gl-ware:
        condition: service_started
      gl-order:
        condition: service_started
      gl-search:
        condition: service_started
      gl-third-party:
        condition: service_started
      gl-auth:
        condition: service_started
      gl-cart:
        condition: service_started
      gl-seckill:
        condition: service_started

  gl-product:
    image: gl-product:latest
    container_name: gl-product
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started
      gl-minio:
        condition: service_healthy

  gl-coupon:
    image: gl-coupon:latest
    container_name: gl-coupon
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-member:
    image: gl-member:latest
    container_name: gl-member
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-ware:
    image: gl-ware:latest
    container_name: gl-ware
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-order:
    image: gl-order:latest
    container_name: gl-order
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-search:
    image: gl-search:latest
    container_name: gl-search
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-es:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-third-party:
    image: gl-third-party:latest
    container_name: gl-third-party
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started
      gl-minio:
        condition: service_healthy

  gl-auth:
    image: gl-auth:latest
    container_name: gl-auth
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-cart:
    image: gl-cart:latest
    container_name: gl-cart
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-seckill:
    image: gl-seckill:latest
    container_name: gl-seckill
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy
      gl-rabbitmq:
        condition: service_healthy
      gl-sentinel:
        condition: service_started
      gl-zipkin:
        condition: service_started

  gl-renren-fast:
    image: gl-renren-fast:latest
    container_name: gl-renren-fast
    restart: unless-stopped
    networks:
      - GrainMall-network
    depends_on:
      gl-nacos:
        condition: service_healthy
      gl-mysql:
        condition: service_healthy
      gl-redis:
        condition: service_healthy


networks:
  GrainMall-network:
    name: GrainMall-network
    driver: bridge
